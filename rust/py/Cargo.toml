[package]
name = "confidence_intervals_for_time_series_forecasts_in_python_rs"
description = "Python bindings (PyO3) for confidence_intervals_for_time_series_forecasts_in_python_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "confidence_intervals_for_time_series_forecasts_in_python_rs"
crate-type = ["cdylib"]

[dependencies]
confidence_intervals_for_time_series_forecasts_in_python_core = { path = "../core" }
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
